<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="discrete" tableValues="0 0 0 0 0 0.005 0.01 0.015"/>
    </feComponentTransfer>
  </filter>
  <rect width="400" height="400" fill="white" filter="url(#noise)" opacity="0.5"/>
</svg>
